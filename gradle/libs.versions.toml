# ---------------------------------------------------------------------------
# UCI :: single source of truth for every dependency version.
# Never hardcode a version inside a build.gradle.kts.
#
# Toolchain: AGP 9.3.2 + Gradle 9.5 + JDK 25, minSdk 24.
# Three pairings here are ATOMIC -- change one and you must change the others:
#   * AGP 9.x  <-> Hilt >= 2.59.2   (Hilt <= 2.58 fails on AGP 9; >= 2.59 fails on AGP 8)
#   * AGP 9.x  <-> Navigation >= 2.9.6 (SafeArgs only learned built-in Kotlin in 2.9.5/2.9.6)
#   * AGP 9.x  <-> KSP >= 2.3.6     (KSP1 is not compatible with AGP 9)
# ---------------------------------------------------------------------------
[versions]
# 9.3.2 and not 9.3.0/9.3.1: those two crash `./gradlew lint` with
# NoSuchMethodError: java.util.List.removeLast() (b/522845800), and lint being
# green is part of this project's definition of done.
agp = "9.3.2"
# The Kotlin *language* version. With AGP 9 the `kotlin-android` plugin is gone,
# so this is applied by overriding AGP's own runtime dependency on KGP -- see
# the buildscript block in the root build.gradle.kts.
kotlin = "2.3.21"
# KSP dropped the `<kotlin>-<ksp>` scheme in 2.3.0; it now versions itself.
ksp = "2.3.11"
coroutines = "1.11.0"
serialization = "1.11.0"

# compileSdk 37 is not optional: Compose UI 1.12.0 and androidx.core 1.19.0 are
# both compiled against it, and AGP 9 refuses a consumer whose compileSdk is
# lower than a library's.
compileSdk = "37"
minSdk = "24"
# Deliberately one below compileSdk: Robolectric 4.16 tops out at SDK 36 and
# defaults to the project's targetSdk, so 37 here would break every unit test.
targetSdk = "36"

androidxCore = "1.19.0"
appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
# Pinned to 1.1.0 on purpose. 1.2.0 changed touch handling
# ("requestDisallowInterceptTouchEvent now honors the request"), which lands
# exactly on the ViewPager2-inside-RecyclerView-plus-MapView area that has
# already cost this project time. Revisit with a device in hand.
swiperefresh = "1.1.0"
activity = "1.13.0"
fragment = "1.9.0"
lifecycle = "2.11.0"
navigation = "2.10.0"
startup = "1.2.0"

composeBom = "2026.08.00"

hilt = "2.60.1"

room = "2.8.4"
retrofit = "3.0.0"
okhttp = "5.5.0"
coil = "3.6.2"
osmdroid = "6.1.20"

junit = "4.13.2"
mockk = "1.14.11"
turbine = "1.2.1"
truth = "1.4.5"
robolectric = "4.16.1"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
javaxInject = "1"
desugar = "2.1.5"

[libraries]
# --- Build-logic classpath ---------------------------------------------------
# Not a project dependency: AGP 9 bundles its own KGP and auto-upgrades lower
# versions, so this is how a *higher* Kotlin version is selected. Verify with
# `./gradlew buildEnvironment | grep kotlin-gradle-plugin`.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# --- Language plumbing -------------------------------------------------------
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

# --- Kotlin / coroutines -----------------------------------------------------
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# --- AndroidX views ----------------------------------------------------------
# `core-ktx`, `activity-ktx` and `fragment-ktx` are empty artifacts now: their
# extensions were merged into the base modules. Same packages, same imports.
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefresh" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }

# --- Lifecycle ---------------------------------------------------------------
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# --- Navigation --------------------------------------------------------------
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "navigation" }

# --- Compose -----------------------------------------------------------------
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }

# --- Hilt --------------------------------------------------------------------
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# --- Room --------------------------------------------------------------------
# `room-ktx` has been an empty artifact since 2.7.0; its coroutine extensions
# live in `room-runtime`.
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# --- Network -----------------------------------------------------------------
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
# First-party since Retrofit 3. The old JakeWharton artifact is archived
# ("This has moved into Retrofit as a first-party converter").
retrofit-serialization-converter = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
# The legacy coordinate, still published alongside `mockwebserver3`. Staying on
# it keeps the existing tests compiling unchanged; `mockwebserver3` swaps
# MockResponse for an immutable builder and `shutdown()` for `close()`.
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

# --- Images / maps -----------------------------------------------------------
# Coil 3: new group id, and `coil-network-okhttp` is mandatory -- coil-core no
# longer ships a network fetcher.
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
osmdroid-android = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }

# --- Testing -----------------------------------------------------------------
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTest" }
androidx-test-junit = { module = "androidx.test.ext:junit-ktx", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[bundles]
compose-ui = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-foundation",
    "androidx-compose-material3",
]
unit-test = [
    "junit",
    "mockk",
    "turbine",
    "truth",
    "kotlinx-coroutines-test",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# NOTE: there is deliberately no `kotlin-android` entry. AGP 9 has built-in
# Kotlin support and actively rejects `org.jetbrains.kotlin.android`:
# "Cannot add extension with name 'kotlin', as there is an extension already
# registered with that name."
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Still required: built-in Kotlin replaces `kotlin-android` and nothing else.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
room = { id = "androidx.room", version.ref = "room" }
