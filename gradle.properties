# ---------------------------------------------------------------------------
# UCI :: Gradle configuration
#
# Toolchain: AGP 9.3.2 + Gradle 9.5 + JDK 25.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Disabled on purpose: KSP + Hilt + Room play nicer without it on first sync.
# Enable it locally once the build is green if you want faster configuration.
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.incremental=true

# ---------------------------------------------------------------------------
# What is NOT here, and why
#
# AGP 9 turned a pile of former opt-ins into defaults. Declaring them again
# would be noise, and a couple of them no longer exist:
#
#   android.useAndroidX                        -> default true since AGP 9.0
#   android.nonTransitiveRClass                -> default true since AGP 8.0
#   android.enableR8.fullMode                  -> default true since AGP 8.0
#   android.defaults.buildfeatures.buildconfig -> removed; use the per-module
#                                                 `buildFeatures { buildConfig = true }`
#   room.incremental                           -> a KAPT-era flag; meaningless
#                                                 for a KSP-only project
#
# Equally deliberate: neither `android.builtInKotlin=false` nor
# `android.newDsl=false` appears here. They are the escape hatches for a build
# that cannot migrate yet, they only work as a pair, and AGP 10 removes them.
# If a first sync fails on a third-party plugin, they are the emergency lever --
# not a resting place.
# ---------------------------------------------------------------------------

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
